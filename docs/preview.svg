<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="微型GPT Web 对话界面示意">
  <title>微型GPT Web 对话界面</title>
  <desc>暗色主题对话界面：用户右对齐蓝色气泡提问，助手左对齐深色气泡返回 Rust 代码。</desc>

  <defs>
    <clipPath id="frame">
      <rect x="0" y="0" width="720" height="420" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="720" height="420" fill="#0f1117"/>

    <rect x="0" y="0" width="720" height="48" fill="#171a23"/>
    <line x1="0" y1="48" x2="720" y2="48" stroke="#2a2e3d" stroke-width="1"/>
    <circle cx="26" cy="24" r="5" fill="#37d67a"/>
    <text x="42" y="24" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#e6e9f2" dominant-baseline="central">微型GPT</text>
    <text x="122" y="25" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#9aa2b5" dominant-baseline="central">Rust 标准库双语基模 · 流式输出</text>
    <rect x="596" y="13" width="100" height="23" rx="8" fill="#222838" stroke="#2a2e3d" stroke-width="1"/>
    <text x="646" y="25" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e6e9f2" text-anchor="middle" dominant-baseline="central">工具链</text>

    <rect x="581" y="76" width="119" height="40" rx="14" fill="#4f8cff"/>
    <text x="640" y="96" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" dominant-baseline="central">我需要打开文件</text>

    <rect x="20" y="136" width="352" height="78" rx="14" fill="#171a23" stroke="#2a2e3d" stroke-width="1"/>
    <text x="36" y="162" font-family="ui-monospace,'JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#e6e9f2" dominant-baseline="central">use std::fs::File;</text>
    <text x="36" y="180" font-family="ui-monospace,'JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#e6e9f2" dominant-baseline="central">let f = File::open("a.txt")?;</text>
    <text x="36" y="198" font-family="ui-monospace,'JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#9aa2b5" dominant-baseline="central">// 动作块命中 · std::fs</text>

    <rect x="622" y="234" width="78" height="40" rx="14" fill="#4f8cff"/>
    <text x="661" y="254" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" dominant-baseline="central">泛型是什么</text>

    <rect x="20" y="294" width="286" height="40" rx="14" fill="#171a23" stroke="#2a2e3d" stroke-width="1"/>
    <text x="36" y="314" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e6e9f2" dominant-baseline="central">类型参数化：把类型当作参数传入</text>

    <rect x="0" y="360" width="720" height="60" fill="#171a23"/>
    <line x1="0" y1="360" x2="720" y2="360" stroke="#2a2e3d" stroke-width="1"/>
    <rect x="20" y="376" width="580" height="32" rx="10" fill="#0f1117" stroke="#2a2e3d" stroke-width="1"/>
    <text x="34" y="392" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#9aa2b5" dominant-baseline="central">问点什么…（Enter 发送，/tool:ast-grep 走源码分析）</text>
    <rect x="608" y="376" width="88" height="32" rx="10" fill="#4f8cff"/>
    <text x="652" y="392" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" dominant-baseline="central">发送</text>
  </g>

  <rect x="0.5" y="0.5" width="719" height="419" rx="12" fill="none" stroke="#2a2e3d" stroke-width="1"/>
</svg>
