# 交叉编译 + Release 发布 workflow
# 照抄社区标准方案（taiki-e/upload-rust-binary-action 官方示例）：
#   - create-gh-release-action 创建 Release
#   - upload-rust-binary-action 用 cargo-zigbuild 交叉编译并上传
#   - 产物命名 lyco_chat-{tag}-{target}，兼容 cargo-binstall 直接下载
# 平台：Linux(x86_64/aarch64) + Android(aarch64/armv7/x86_64, Termux 用 aarch64)
#        + Windows(x86_64/aarch64) + macOS(双架构/universal) + iOS(真机/模拟器)

name: release

permissions:
  contents: read

on:
  push:
    tags:
      - v[0-9]+.*
  workflow_dispatch:
  pull_request:

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 需要给 create-gh-release-action 写 Release 权限
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Linux（cargo-zigbuild，zig 交叉编译）----
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            build-tool: cargo-zigbuild
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            build-tool: cargo-zigbuild
          # ---- Android（Termux 直接用 aarch64-linux-android 二进制）----
          - target: aarch64-linux-android
            os: ubuntu-latest
            build-tool: cargo-zigbuild
          - target: armv7-linux-androideabi
            os: ubuntu-latest
            build-tool: cargo-zigbuild
          - target: x86_64-linux-android
            os: ubuntu-latest
            build-tool: cargo-zigbuild
          # ---- Windows（msvc，本机原生）----
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          # ---- macOS（原生 Xcode；逗号分隔 = lipo universal）----
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin,aarch64-apple-darwin
            os: macos-14
          # ---- iOS（真机 + 模拟器 universal）----
          - target: aarch64-apple-ios
            os: macos-14
          - target: x86_64-apple-ios,aarch64-apple-ios-sim
            os: macos-14
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # 上传 Release 资产
    steps:
      - uses: actions/checkout@v4
      - uses: goto-bus-stop/setup-zig@v2
        if: matrix.build-tool == 'cargo-zigbuild'
        with:
          version: 0.14.1
      - name: iOS SDK env
        if: contains(matrix.target, 'apple-ios')
        run: |
          if [[ "${{ matrix.target }}" == *"-sim"* ]]; then
            echo "SDKROOT=$(xcrun --sdk iphonesimulator --show-sdk-path)" >> "$GITHUB_ENV"
          else
            echo "SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)" >> "$GITHUB_ENV"
          fi
          echo "IPHONEOS_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: demo_chat
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.build-tool || 'cargo' }}
          archive: lyco_chat-$tag-$target
          tar: unix
          zip: windows
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  # crates.io 发布（打 v* tag 时；需在仓库 Secrets 配 CARGO_REGISTRY_TOKEN）
  publish:
    needs: upload-assets
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
