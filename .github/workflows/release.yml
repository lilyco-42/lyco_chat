# 交叉编译 + Release 发布 workflow
# 基于社区标准方案（taiki-e/upload-rust-binary-action 官方示例）：
#   - create-gh-release-action 创建 Release
#   - upload-rust-binary-action 交叉编译并上传（binstall 兼容命名）
#   - sccache 走 GitHub Actions 缓存服务加速编译
# 平台：Linux(x86_64/aarch64, zigbuild) + Android(aarch64/armv7/x86_64, NDK;
#         Termux 用 aarch64) + Windows(x86_64/aarch64) + macOS(双架构/universal)
#        + iOS(真机 aarch64 + 模拟器 aarch64)
#
# 说明：Android 用 NDK 而非 zig，因为 reqwest 的 rustls 后端 aws-lc-sys
# 用 zig 交叉编译 android 时找不到 bionic 头文件（sys/types.h）。

name: release

permissions:
  contents: read

on:
  push:
    tags:
      - v[0-9]+.*
  workflow_dispatch:

jobs:
  create-release:
    # 只有 tag 推送才建 Release；workflow_dispatch 只是测试编译（dry-run）
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ---- Linux（cargo-zigbuild，zig 交叉编译）----
  linux:
    # 等 Release 创建（tag 时）；always() 让 dispatch 也能 dry-run 编译
    if: always()
    needs: create-release
    permissions:
      contents: write
    name: linux-${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Enable sccache for rust
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.1
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: demo_chat
          target: ${{ matrix.target }}
          build-tool: cargo-zigbuild
          archive: lyco_chat-$tag-$target
          checksum: sha256
          dry-run: ${{ github.ref_type != 'tag' }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # ---- Android（NDK 交叉编译；Termux 直接跑 aarch64 二进制）----
  android:
    # 等 Release 创建（tag 时）；always() 让 dispatch 也能 dry-run 编译
    if: always()
    needs: create-release
    permissions:
      contents: write
    name: android-${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android]
    steps:
      - uses: actions/checkout@v4
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Enable sccache for rust
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: demo_chat
          target: ${{ matrix.target }}
          archive: lyco_chat-$tag-$target
          checksum: sha256
          dry-run: ${{ github.ref_type != 'tag' }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # ---- Windows（msvc，本机原生）----
  windows:
    # 等 Release 创建（tag 时）；always() 让 dispatch 也能 dry-run 编译
    if: always()
    needs: create-release
    permissions:
      contents: write
    name: windows-${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Enable sccache for rust
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: demo_chat
          target: ${{ matrix.target }}
          archive: lyco_chat-$tag-$target
          checksum: sha256
          dry-run: ${{ github.ref_type != 'tag' }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # ---- macOS（原生 Xcode；universal = lipo 双架构）----
  macos:
    # 等 Release 创建（tag 时）；always() 让 dispatch 也能 dry-run 编译
    if: always()
    needs: create-release
    permissions:
      contents: write
    name: macos-${{ matrix.target }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin, universal-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Enable sccache for rust
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: demo_chat
          target: ${{ matrix.target }}
          archive: lyco_chat-$tag-$target
          checksum: sha256
          dry-run: ${{ github.ref_type != 'tag' }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # ---- iOS（真机 aarch64 + 模拟器 aarch64）----
  ios:
    # 等 Release 创建（tag 时）；always() 让 dispatch 也能 dry-run 编译
    if: always()
    needs: create-release
    permissions:
      contents: write
    name: ios-${{ matrix.target }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-ios, aarch64-apple-ios-sim]
    steps:
      - uses: actions/checkout@v4
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Enable sccache for rust
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - name: iOS SDK env
        run: |
          if [[ "${{ matrix.target }}" == *"-sim"* ]]; then
            echo "SDKROOT=$(xcrun --sdk iphonesimulator --show-sdk-path)" >> "$GITHUB_ENV"
          else
            echo "SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)" >> "$GITHUB_ENV"
          fi
          echo "IPHONEOS_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: demo_chat
          target: ${{ matrix.target }}
          archive: lyco_chat-$tag-$target
          checksum: sha256
          dry-run: ${{ github.ref_type != 'tag' }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # crates.io 发布（打 v* tag 时；需在仓库 Secrets 配 CARGO_REGISTRY_TOKEN）
  # 未配 token 时 continue-on-error，不影响 Release 与二进制产物
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, android, windows, macos, ios]
    runs-on: ubuntu-latest
    environment: crates-io
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
