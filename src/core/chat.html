<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微型GPT · 对话</title>
<style>
  :root { --bg:#0f1117; --panel:#171a23; --line:#2a2e3d; --txt:#e6e9f2; --dim:#9aa2b5; --accent:#4f8cff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 20px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  header .dot { width:10px; height:10px; border-radius:50%; background:#37d67a; box-shadow:0 0 8px #37d67a88; }
  header h1 { font-size:15px; font-weight:600; }
  header span { color:var(--dim); font-size:12px; flex:1; }
  #status-btn { background:#222838; border:1px solid var(--line); color:var(--txt); border-radius:8px; padding:6px 12px; font-size:12px; cursor:pointer; font-family:ui-monospace,monospace; }
  #status-btn:hover { border-color:var(--accent); }
  /* nvim 浮动窗口样式 */
  #nvim-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50; }
  #nvim-dialog { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:60; display:none; font-family:ui-monospace,"JetBrains Mono",Consolas,monospace; }
  #nvim-dialog .box { background:#1e2430; border:1px solid #3b4261; border-radius:2px; box-shadow:0 12px 40px rgba(0,0,0,.6); min-width:460px; max-width:92vw; max-height:70vh; display:flex; flex-direction:column; }
  #nvim-dialog .title { padding:8px 12px; border-bottom:1px solid #3b4261; color:#ffd9a0; font-size:13px; letter-spacing:.5px; display:flex; align-items:center; gap:8px; }
  #nvim-dialog .title .md { color:#7c88ff; }
  #nvim-dialog .body { padding:10px 12px; overflow-y:auto; font-size:13px; line-height:1.7; }
  #nvim-dialog .row { display:flex; gap:8px; }
  #nvim-dialog .lbl { color:#6f7baa; min-width:110px; text-align:right; }
  #nvim-dialog .val { color:#d8dee9; }
  #nvim-dialog .ok { color:#37d67a; }
  #nvim-dialog .warn { color:#ffb454; }
  #nvim-dialog .err { color:#ff6b6b; font-weight:600; }
  #nvim-dialog .titlebar-drag { height:0; }
  #nvim-dialog .footer { padding:6px 12px; border-top:1px solid #3b4261; color:#8a93b8; font-size:12px; display:flex; gap:16px; }
  #nvim-dialog .footer kbd { color:#ffd9a0; }
  #chat { flex:1; overflow-y:auto; padding:20px; max-width:820px; width:100%; margin:0 auto; }
  .msg { margin:14px 0; max-width:78%; }
  .msg .bubble { padding:11px 14px; border-radius:14px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
  .user { margin-left:auto; text-align:right; }
  .user .bubble { background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
  .bot .bubble { background:var(--panel); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .bot .cursor { display:inline-block; width:8px; height:16px; background:var(--accent); vertical-align:-2px; animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  #inputbar { padding:14px 20px 18px; background:var(--panel); border-top:1px solid var(--line); }
  .row { max-width:820px; margin:0 auto; display:flex; gap:10px; }
  textarea { flex:1; resize:none; background:var(--bg); color:var(--txt); border:1px solid var(--line); border-radius:10px; padding:11px 13px; font-size:14px; outline:none; line-height:1.4; }
  textarea:focus { border-color:var(--accent); }
  button { background:var(--accent); color:#fff; border:none; border-radius:10px; padding:0 22px; font-size:14px; cursor:pointer; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .hint { max-width:820px; margin:6px auto 0; color:var(--dim); font-size:11px; }
</style>
</head>
<body>
<header>
  <div class="dot"></div>
  <h1>微型GPT</h1>
  <span>Rust 标准库双语基模 · 流式输出</span>
  <button id="status-btn">🦀 工具链</button>
</header>

<!-- nvim 风格浮动窗口 -->
<div id="nvim-backdrop"></div>
<div id="nvim-dialog" role="dialog" aria-label="rust 工具链状态">
  <div class="box">
    <div class="title"><span class="md"></span> rust 工具链状态</div>
    <div class="body" id="toolchain-body">加载中…</div>
    <div class="footer"><span><kbd>q</kbd>/<kbd>Esc</kbd> 关闭</span><span><kbd>r</kbd> 刷新</span><span id="toolchain-ts"></span></div>
  </div>
</div>

<div id="chat">
  <div class="msg bot"><div class="bubble">你好，我是微型GPT。可以问我 Rust 相关的问题，比如：<br>· 我需要打开文件<br>· 怎么生成随机数<br>· 如何定义函数</div></div>
</div>

<div id="inputbar">
  <div class="row">
    <textarea id="input" rows="1" placeholder="输入问题，回车发送…"></textarea>
    <button id="send">发送</button>
  </div>
  <div class="hint">回车发送 · Shift+回车换行 · 回答为流式（SSE）输出</div>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const send = document.getElementById('send');

function addMsg(role, html) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  wrap.innerHTML = '<div class="bubble">' + html + '</div>';
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return wrap.querySelector('.bubble');
}

send.addEventListener('click', ask);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
});

async function ask() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  send.disabled = true;
  addMsg('user', escapeHtml(text));
  const bubble = addMsg('bot', '<span class="cursor"></span>');

  try {
    const res = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'demo_chat', stream: true, messages: [{ role: 'user', content: text }] })
    });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    let out = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const chunk = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        for (const line of chunk.split('\n')) {
          if (!line.startsWith('data:')) continue;
          const data = line.slice(5).trim();
          if (data === '[DONE]') continue;
          try {
            const j = JSON.parse(data);
            const d = j.choices && j.choices[0] && j.choices[0].delta;
            if (d && d.content) {
              out += d.content;
              bubble.innerHTML = escapeHtml(out) + '<span class="cursor"></span>';
              chat.scrollTop = chat.scrollHeight;
            }
          } catch (_) {}
        }
      }
    }
    bubble.innerHTML = escapeHtml(out);
  } catch (e) {
    bubble.innerHTML = '⚠️ 请求出错: ' + escapeHtml(String(e));
  }
  send.disabled = false;
  input.focus();
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ---- nvim 风格工具链对话框 ---- */
const dialog = document.getElementById('nvim-dialog');
const backdrop = document.getElementById('nvim-backdrop');
const statusBtn = document.getElementById('status-btn');

function openDialog() {
  backdrop.style.display = 'block';
  dialog.style.display = 'block';
  refreshToolchain();
}
function closeDialog() {
  backdrop.style.display = 'none';
  dialog.style.display = 'none';
}
async function refreshToolchain() {
  const body = document.getElementById('toolchain-body');
  document.getElementById('toolchain-ts').textContent = new Date().toLocaleTimeString();
  try {
    const r = await fetch('/toolchain');
    const st = await r.json();
    const cls = (ok, err) => err ? 'err' : (ok ? 'ok' : 'warn');
    let html = row('cargo', st.cargo_version || '?');
    html += row('rustc', st.rustc_version || '?');
    html += row('latest', st.latest_stable || '?', cls(false, st.latest_stable === null));
    if (st.lag !== null && st.lag !== undefined) {
      html += row('落后', st.lag + ' 个小版本', cls(st.lag < 6, false));
    }
    if (st.lag_message) html += row('', st.lag_message, st.lag_message.startsWith('[warning]') ? 'err' : 'warn');
    if (st.toolchain_warning) html += row('', st.toolchain_warning, 'warn');
    html += row('启动于', st.startup_time || '?');
    html += row('启动次数', st.startups.length + ' 次');
    if (st.startups && st.startups.length > 1) {
      html += '<div class="lbl"></div><div class="val" style="color:#6f7baa">最近启动：' +
        st.startups.slice(-3).map(escapeHtml).join(' &nbsp;·&nbsp; ') + '</div>';
    }
    html += row('uptime', (st.uptime_secs||0) + ' s');
    body.innerHTML = html;
  } catch (e) {
    body.innerHTML = '<div class="err">无法获取工具链状态: ' + escapeHtml(String(e)) + '</div>';
  }
}
function row(lbl, val, cls) {
  const c = cls ? ' class="' + cls + '"' : '';
  return '<div class="row"><div class="lbl">' + escapeHtml(lbl) + '</div><div class="val"' + c + '>' + escapeHtml(String(val)) + '</div></div>';
}

statusBtn.addEventListener('click', openDialog);
backdrop.addEventListener('click', closeDialog);
document.addEventListener('keydown', e => {
  if (dialog.style.display === 'block') {
    if (e.key === 'Escape' || e.key.toLowerCase() === 'q') closeDialog();
    if (e.key.toLowerCase() === 'r') refreshToolchain();
  }
});
</script>
</body>
</html>
