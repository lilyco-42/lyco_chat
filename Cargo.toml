[package]
name = "demo_chat"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
ast-grep = "0.45"
ast-grep-core = "0.45"
ast-grep-language = "0.45"
candle-core = { git = "https://github.com/huggingface/candle.git", version = "0.11.0", features = ["cuda"] }
candle-nn = { git = "https://github.com/huggingface/candle.git", version = "0.11.0" }
futures-util = "0.3.33"
home = "0.5"
jieba-rs = "0.7"
ndarray = { version = "0.16", features = ["rayon", "serde"] }
once_cell = "1"
rand = "0.10.2"
rand_distr = "0.6"
rayon = "1"
reqwest = { version = "0.13.4", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
